services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0   # inside the container; the port below is still bound to 127.0.0.1
    volumes:
      - ./data:/data
    # 只绑定本机，外部通过 Tailscale 访问（见 README）
    ports:
      - "127.0.0.1:8080:8080"
